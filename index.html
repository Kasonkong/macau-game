<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>濠江飛馳</title>
<meta name="description" content="在按真實比例重建的澳門自由駕駛：主線故事、支線、競速、打工、收集葡撻，沿途是真實的商舖、住宅大廈、交通燈與輕軌。">
<meta property="og:title" content="濠江飛馳">
<meta property="og:description" content="按 OpenStreetMap 真實數據重建的澳門開放世界遊戲。">
<meta name="theme-color" content="#0E1519">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-screen canvas; HUD chips in the four corners; phone slides up bottom-right; overlays centred.
   One committed dark-glass look so the HUD reads over day and night scenes alike. */
:root{
  --bg:#0E1519; --glass:rgb(12 20 25 / .78); --glass-2:rgb(12 20 25 / .93); --line:rgb(255 255 255 / .14);
  --ink:#EEF3F4; --ink-soft:#A7B5BA; --accent:#F2C14E; --tile:#2F6FD6; --good:#5DD39E; --warn:#FF8A5B; --main:#E0463A; --side:#3E8EDE; --race:#F08A24; --job:#2BB37A; --lrt:#21A598;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button{font-family:var(--f-body);color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:var(--f-mono);font-size:12px;background:rgb(255 255 255 / .12);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:0 2px;color:var(--ink)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#tl{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:grid;gap:8px;max-width:min(380px,calc(100% - 210px));pointer-events:none}
#loc{padding:7px 12px;display:grid;gap:1px;width:max-content;max-width:100%}
#loc .pr{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:.06em;line-height:1.2}
#loc .pr small{font-family:var(--f-mono);font-size:10px;font-weight:400;letter-spacing:.12em;color:var(--ink-soft);margin-left:6px}
#loc .st{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mission{padding:10px 12px;display:grid;gap:3px;border-left:3px solid var(--accent)}
#mission .mt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent)}
#mission .mm{font-size:14px;line-height:1.45}
#mission .ms{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#tr{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.chip{padding:6px 11px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
#money b{color:var(--accent);font-size:16px;font-weight:600}
#money .delta{margin-left:6px;font-weight:600}
#menu-btn{width:40px;height:36px;font-size:17px;cursor:pointer;display:grid;place-items:center}
#stam{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(196px + env(safe-area-inset-bottom,0px));width:170px;height:5px;border-radius:3px;background:rgb(255 255 255 / .15);overflow:hidden}
#stam i{display:block;height:100%;background:var(--good);width:100%;transition:width .2s}
#minimap{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:170px;height:170px;border-radius:50%;border:2px solid var(--line);box-shadow:0 4px 18px rgb(0 0 0 / .45);cursor:pointer;background:#123}
#br{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:end}
#speedo{padding:6px 14px 8px;text-align:right;min-width:110px}
#speedo b{display:block;font-family:var(--f-mono);font-size:38px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
#speedo span{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-soft);letter-spacing:.12em}
#radio{padding:5px 10px;font-size:12px;color:var(--ink-soft)}
#radio b{color:var(--ink);font-weight:500}
#prompt{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 14px;font-size:14px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#fps{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:11px;padding:3px 8px;pointer-events:none}
#bubble{position:fixed;transform:translate(-50%,-100%);background:#FBFAF6;color:#1B1D1F;font-size:13.5px;font-weight:600;padding:6px 11px;border-radius:12px;white-space:nowrap;pointer-events:none;box-shadow:0 3px 12px rgb(0 0 0 / .35)}
#bubble::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#FBFAF6}
#lockhint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;font-size:14px;pointer-events:none}
#dmgbar{height:4px;margin-top:6px;border-radius:2px;background:rgb(255 255 255 / .14);overflow:hidden}#dmgbar i{display:block;height:100%;width:0;background:var(--good)}
#gps{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(214px + env(safe-area-inset-bottom,0px));padding:7px 12px;font-size:14px;max-width:260px}
#gps b{font-size:18px;margin-right:4px;color:#6FB2FF}
body.touch #gps{bottom:calc(316px + env(safe-area-inset-bottom,0px))}
@media (orientation:landscape) and (max-height:520px){body.touch #gps{bottom:auto;top:calc(186px + env(safe-area-inset-top,0px));left:auto;right:max(12px,env(safe-area-inset-right,0px))}}
#timer{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:6px 14px;font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
#timer.low{color:var(--warn)}
#toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:10px 16px;text-align:center;max-width:min(460px,calc(100% - 24px))}
#toast .tt{font-family:var(--f-display);font-size:20px;font-weight:700}
#toast .ts{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.5}
#big{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#big .bt{font-family:var(--f-display);font-size:clamp(34px,7vw,64px);font-weight:700;color:var(--accent);text-shadow:0 4px 30px rgb(0 0 0 / .6);letter-spacing:.08em}
#big .bs{font-size:15px;margin-top:4px;text-shadow:0 2px 10px rgb(0 0 0 / .8)}
#count{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:min(22vw,140px);font-weight:600;color:var(--accent);text-shadow:0 4px 30px rgb(0 0 0 / .6);pointer-events:none}
#say{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 24px));padding:12px 16px 12px;cursor:pointer}
#say .who{font-family:var(--f-display);font-size:16px;font-weight:700;color:var(--accent)}
#say .txt{font-size:15px;line-height:1.6;margin-top:3px}
#say .nx{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft);text-align:right;margin-top:4px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:30}
#photo-frame{position:fixed;inset:6%;border:2px solid rgb(255 255 255 / .7);border-radius:6px;pointer-events:none}
#photo-frame span{position:absolute;left:50%;bottom:-36px;transform:translateX(-50%);font-size:13px;white-space:nowrap}

/* card / dialogs */
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px max(14px,env(safe-area-inset-right,0px)) 16px max(14px,env(safe-area-inset-left,0px));background:rgb(6 10 13 / .55);z-index:20;overflow:auto}
.sheet.arming{pointer-events:none}
.sheet{width:min(560px,100%);padding:20px 22px 18px;background:var(--glass-2);border:1px solid var(--line);border-radius:12px;display:grid;gap:12px;max-height:calc(100dvh - 32px);overflow:auto}
.sheet h2{margin:0;font-family:var(--f-display);font-size:26px;letter-spacing:.04em}
.sheet h3{margin:6px 0 0;font-size:11px;font-weight:500;letter-spacing:.22em;color:var(--ink-soft)}
.eb{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em}
.sheet p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.65}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 14px var(--f-body);padding:10px 16px;border-radius:7px;border:1px solid var(--line);background:rgb(255 255 255 / .08);cursor:pointer;min-height:42px}
.btn:hover{background:rgb(255 255 255 / .15)}
.btn.primary{background:var(--accent);color:#1B1606;border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:9px 12px;border-radius:8px;background:rgb(255 255 255 / .05);border:1px solid transparent;text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}
.item:hover{border-color:var(--line);background:rgb(255 255 255 / .09)}
.item .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;grid-row:span 2}
.item .nm{font-weight:600;font-size:14.5px}
.item .ds{grid-column:2;font-size:12px;color:var(--ink-soft);line-height:1.45}
.item .rt{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-soft);grid-row:span 2;text-align:right;font-variant-numeric:tabular-nums}
.item.done .nm{color:var(--ink-soft)}
.item.lock{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{font:600 13.5px var(--f-body);padding:8px 14px;border:0;background:transparent;color:var(--ink-soft);cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1B1606}
.set{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;align-items:center;font-size:14px}
.bar{height:6px;background:rgb(255 255 255 / .12);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.stat{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:14px}
.stat b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.help{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--ink-soft);align-items:center}
.help dt{white-space:nowrap}.help dd{margin:0}
.note{font-size:11.5px!important;line-height:1.6}
.note a,.sheet a{color:var(--accent)}

/* start */
#start{background:radial-gradient(120% 90% at 30% 10%,rgb(28 58 82 / .55) 0%,rgb(11 20 24 / .7) 60%)}
#start .sheet{width:min(520px,100%)}
.title{display:grid;gap:2px}
.title h1{margin:0;font-family:var(--f-display);font-size:clamp(46px,10vw,72px);line-height:1;letter-spacing:.08em}
.title .sub{font-family:var(--f-mono);font-size:12px;letter-spacing:.3em;color:var(--accent)}
.tiles{height:10px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--tile) 0 10px,#EAF0F6 10px 12px,var(--tile) 12px 22px,transparent 22px 24px);opacity:.85}
#ld-msg{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-soft)}
#ld-msg.err{color:var(--warn);font-family:var(--f-body);font-size:13.5px}
.chars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.char{display:grid;gap:6px;padding:12px;border-radius:10px;border:2px solid var(--line);background:rgb(255 255 255 / .05);cursor:pointer;text-align:left;font:inherit;color:inherit}
.char[aria-pressed="true"]{border-color:var(--accent);background:rgb(242 193 78 / .1)}
.char .fig{height:86px;display:grid;place-items:end center}
.char .nm{font-family:var(--f-display);font-size:20px;font-weight:700}
.char .ds{font-size:12px;color:var(--ink-soft);line-height:1.5}

/* phone */
#phone{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));height:min(620px,calc(100dvh - 32px));border-radius:28px;background:#0b1013;border:6px solid #1f272c;box-shadow:0 20px 60px rgb(0 0 0 / .6);display:flex;flex-direction:column;overflow:hidden;z-index:18}
#phone .bar-top{display:flex;justify-content:space-between;padding:10px 18px 6px;font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}
#phone .scr{flex:1;overflow:auto;padding:6px 14px 14px;display:grid;align-content:start;gap:10px}
#phone .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding-top:10px}
.app{display:grid;justify-items:center;gap:6px;background:none;border:0;cursor:pointer;font-size:11.5px;color:var(--ink)}
.app i{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:700;color:#fff;box-shadow:inset 0 -3px 0 rgb(0 0 0 / .2)}
#phone .ph-h{display:flex;align-items:center;gap:10px}
#phone .ph-h h4{margin:0;font-family:var(--f-display);font-size:22px}
#phone .back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:16px}
#phone .home{height:5px;width:120px;margin:6px auto 10px;border-radius:3px;background:#5a656b;cursor:pointer;border:0}

/* map */
#dlg{z-index:25}
#mapview{position:fixed;inset:0;z-index:16;background:#0B1418}
#bigmap{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.maphint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 14px;font-size:13px;color:var(--ink-soft);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#map-close{background:var(--glass-2);position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
#map-legend{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:8px 12px;display:grid;gap:4px;font-size:12px}
#map-legend span{display:inline-flex;align-items:center;gap:6px}
#map-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* touch */
#touch{position:fixed;inset:0;pointer-events:none}
#joy{position:fixed;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:136px;height:136px;border-radius:50%;background:rgb(255 255 255 / .08);border:1px solid var(--line);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgb(255 255 255 / .28)}
.tb{position:fixed;width:60px;height:60px;border-radius:50%;background:rgb(12 20 25 / .72);border:1px solid var(--line);color:var(--ink);font:600 13px var(--f-body);pointer-events:auto;touch-action:none;display:grid;place-items:center;line-height:1.1;text-align:center}
.tb.s{width:46px;height:46px;font-size:11.5px}
#tb-f{right:max(22px,env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#tb-sp{right:max(92px,calc(env(safe-area-inset-right,0px) + 92px));bottom:calc(28px + env(safe-area-inset-bottom,0px))}
#tb-run{right:max(22px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#tb-e{right:max(92px,calc(env(safe-area-inset-right,0px) + 92px));bottom:calc(104px + env(safe-area-inset-bottom,0px))}
#tb-row{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(56px + env(safe-area-inset-top,0px));display:flex;gap:6px;pointer-events:auto}
#tb-row .tb{position:static}
body.touch #tb-row{flex-direction:column;top:calc(102px + env(safe-area-inset-top,0px))}
body.touch #minimap{width:112px;height:112px;bottom:calc(178px + env(safe-area-inset-bottom,0px))}
body.touch #stam{bottom:calc(298px + env(safe-area-inset-bottom,0px));width:112px}
body.touch #toast{max-width:calc(100% - 150px)}
@media (max-width:560px){body.touch #toast,#toast{top:calc(96px + env(safe-area-inset-top,0px))}}
body.touch #br{bottom:calc(184px + env(safe-area-inset-bottom,0px))}
body.touch #speedo b{font-size:26px}
body.touch #prompt{bottom:calc(180px + env(safe-area-inset-bottom,0px))}
body.touch #say{bottom:calc(190px + env(safe-area-inset-bottom,0px))}
body.touch #tl{max-width:calc(100% - 200px)}
@media (orientation:landscape) and (max-height:520px){
  body.touch #tb-row{flex-direction:row;top:calc(10px + env(safe-area-inset-top,0px));right:auto;left:50%;transform:translateX(-50%)}
  body.touch #minimap{width:100px;height:100px;bottom:auto;left:auto;right:max(12px,env(safe-area-inset-right,0px));top:calc(58px + env(safe-area-inset-top,0px))}
  body.touch #stam{bottom:auto;left:auto;right:max(12px,env(safe-area-inset-right,0px));top:calc(164px + env(safe-area-inset-top,0px));width:100px}
  body.touch #toast{top:calc(64px + env(safe-area-inset-top,0px))}
  body.touch #tl{max-width:calc(50% - 170px)}
  body.touch #say{bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 420px))}
  body.touch #prompt{bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 440px)}
}
@media (max-width:560px){#tr{flex-wrap:wrap;justify-content:flex-end;width:172px;row-gap:6px}#clock{order:3}#tl{max-width:calc(100% - 196px)}#loc .pr small{display:none}#loc .pr{font-size:15px}#mission .mm{font-size:13px}.chip{font-size:12px;padding:5px 8px}#money b{font-size:14px}}
@media (prefers-reduced-motion:reduce){.bar i,#stam i,#flash,#fade{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="hud" hidden>
  <div id="tl">
    <div id="loc" class="glass"><div class="pr" id="loc-pr">澳門</div><div class="st" id="loc-st"></div></div>
    <div id="mission" class="glass" hidden><span class="mt" id="m-t"></span><span class="mm" id="m-m"></span><span class="ms" id="m-s"></span></div>
  </div>
  <div id="tr">
    <div class="chip glass" id="clock">17:10 · 晴 29°</div>
    <div class="chip glass" id="money">MOP <b id="money-v">0</b><span class="delta" id="money-d"></span></div>
    <button class="glass" id="menu-btn" type="button" aria-label="暫停選單">☰</button>
  </div>
  <div id="stam"><i id="stam-v"></i></div>
  <canvas id="minimap" width="340" height="340" aria-label="小地圖，點擊打開大地圖"></canvas>
  <div id="br"><div id="radio" class="glass" hidden></div><div id="speedo" class="glass" hidden><b id="spd">0</b><span>KM/H</span><div id="dmgbar" title="車身損壞"><i></i></div></div></div>
  <div id="prompt" class="glass" hidden></div>
  <div id="fps" class="chip glass" hidden></div>
  <div id="bubble" hidden></div>
  <div id="gps" class="glass" hidden></div>

  <button class="tb" id="tb-run" type="button" data-k="ShiftLeft" data-hold="1">衝刺</button>

    <button class="tb s" type="button" data-k="KeyH" data-mode="car">響號</button>
    <button class="tb s" type="button" data-k="KeyV">鏡頭</button>
    <button class="tb s" type="button" data-k="KeyP" data-mode="foot">影相</button>

</div>
